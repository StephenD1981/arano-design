# Definition-of-done security checks (brief v2.2 Phase 3, WP-4). This repository is public, so it
# cannot use the shared action in the private arano-engineering repository; these steps mirror that
# action at v0.3.0 for a Node-only repository, using the copies in .github/security-checks/ (taken
# from the base branch, so a pull request cannot change the checks that judge it). Runs the pull
# request's code: no secrets, read-only access.
name: security-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trusted check scripts (from the base branch, not the pull request)
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          for f in scan_secrets.sh gitleaks.toml licences.py; do
            # The checkout's copy is used only while the base branch has none (the PR that adds them).
            git show "$BASE_REF:.github/security-checks/$f" > "$RUNNER_TEMP/checks/$f" 2>/dev/null ||
              cp ".github/security-checks/$f" "$RUNNER_TEMP/checks/$f"
          done

      - name: Secret scan (gitleaks, every commit in the pull request or push)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version=8.28.0
          digest=a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
          dir="$RUNNER_TEMP/gitleaks"; mkdir -p "$dir"
          curl -fsSL -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          echo "$digest  $dir/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          bash "$RUNNER_TEMP/checks/scan_secrets.sh" "$dir/gitleaks" "$BASE" "$HEAD"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Semgrep (fails only on findings new since the base or the previous push)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          ( cd "$RUNNER_TEMP" && python -I -m pip install --quiet semgrep==1.181.0 )
          # --disable-nosem: nosemgrep comments in the checkout do not hide findings.
          args=(--config p/typescript --config p/javascript --metrics=off --error --disable-nosem)
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then
            args+=(--baseline-commit "$BASE")
          fi
          semgrep scan "${args[@]}"

      - name: Known vulnerabilities and licences (Node)
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high --package-lock-only
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --silent
          # Every non-dev package in the lock, private ones included, from its installed package.json.
          python3 -I "$RUNNER_TEMP/checks/licences.py" node .
