# Definition-of-done security checks (brief v2.2 Phase 3, WP-4). This repository is public, so it
# cannot use the shared action in the private arano-engineering repository; these steps mirror it
# for a Node-only repository. Runs the pull request's code: no secrets, read-only access.
name: security-checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Known vulnerabilities and licences (Node)
        run: |
          npm audit --omit=dev --audit-level=high --package-lock-only
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --silent
          npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages \
            --failOn "GPL-2.0;GPL-3.0;AGPL-3.0;GPL-2.0-only;GPL-3.0-only;AGPL-3.0-only;GPL-2.0-or-later;GPL-3.0-or-later;AGPL-3.0-or-later;AGPL-1.0"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Semgrep (pull requests fail only on new findings)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m pip install --quiet semgrep==1.181.0
          if [ -n "$BASE" ]; then
            semgrep scan --config p/typescript --config p/javascript --metrics=off --error --baseline-commit "$BASE"
          else
            semgrep scan --config p/typescript --config p/javascript --metrics=off
          fi
